<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Plus+Jakarta+Sans:wght@500&amp;display=swap');
      .zen {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600;
        fill: #B69A68;
        letter-spacing: -0.01em;
      }
      .finith {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 500;
        fill: #1A1A1A;
        letter-spacing: -0.03em;
      }
      .pill {
        fill: #FFFFFF;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.06));
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ECE9E2"/>

  <!-- Logo Pill Badge -->
  <g transform="translate(140, 440)">
    <rect class="pill" width="800" height="200" rx="100" />
    <text x="400" y="132" text-anchor="middle" font-size="105">
      <tspan class="zen">Zen</tspan><tspan class="finith">finith</tspan>
    </text>
  </g>
</svg>